<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lost | Ali Iftikhar</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23e5534b'/%3E%3Cg fill='none' stroke='%23fff' stroke-width='6.5' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M11 49 L23 15 L35 49'/%3E%3Cpath d='M15.5 37 H30.5'/%3E%3Cpath d='M47 29 V49'/%3E%3C/g%3E%3Ccircle cx='47' cy='18' r='4.4' fill='%23fff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Gochi+Hand&display=swap" rel="stylesheet">
<style>
:root{--bg:#fbfaf7;--fg:#161616;--muted:#6f6f6b;--card:#fff;--marker:#e5534b;--tape:rgba(214,203,172,.55);--dot:rgba(22,22,22,.13)}
@media (prefers-color-scheme:dark){:root{--bg:#111;--fg:#ededeb;--muted:#9a9a95;--card:#1b1b1b;--marker:#f07a72;--tape:rgba(120,110,88,.5);--dot:rgba(237,237,235,.1)}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px 18px;background:var(--bg);color:var(--fg);font:15px/1.6 Inter,system-ui,sans-serif;
  background-image:radial-gradient(var(--dot) 1.2px,transparent 1.3px);background-size:24px 24px}
.wrap{text-align:center;max-width:420px;width:100%}
.code{font-size:13px;color:var(--muted);letter-spacing:.14em;margin-bottom:26px}
.note{position:relative;background:var(--card);padding:32px 30px 26px;transform:rotate(-2.5deg);text-align:left;
  box-shadow:0 1px 2px rgba(0,0,0,.06),0 18px 36px -22px rgba(0,0,0,.4);font-family:"Gochi Hand",cursive;color:var(--marker);font-size:25px;line-height:1.35}
.note::before{content:"";position:absolute;top:-11px;left:50%;width:84px;height:22px;margin-left:-42px;background:var(--tape);transform:rotate(-4deg)}
.note .h{font-size:31px;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:7px;margin-bottom:8px;display:inline-block}
.note s{opacity:.55;text-decoration-thickness:2px}
.note .sig{text-align:right;margin-top:8px;font-size:27px}
a.home{display:inline-block;margin-top:34px;color:var(--muted);text-decoration:none;border-bottom:1px solid currentColor;font-size:14px}
a.home:hover{color:var(--fg)}
.dog{position:fixed;bottom:14px;left:0;width:84px;color:#8a8577;animation:walk 16s linear infinite}
.dog svg{width:84px;height:53px;display:block;animation:face 16s steps(1) infinite}
.dog .lg{transform-box:fill-box;transform-origin:top center;animation:step .5s ease-in-out infinite alternate}.dog .lg.b{animation-delay:.25s}
.dog .hd{transform-box:fill-box;transform-origin:right top;animation:sniffd 1.6s ease-in-out infinite}
.dog .tl{transform-box:fill-box;transform-origin:left bottom;animation:wag .3s ease-in-out infinite alternate}
@keyframes walk{0%{transform:translateX(-80px)}48%{transform:translateX(calc(100vw + 10px))}50%{transform:translateX(calc(100vw + 10px))}98%{transform:translateX(-80px)}100%{transform:translateX(-80px)}}
@keyframes face{0%{transform:scaleX(-1)}50%{transform:none}}
@keyframes step{to{transform:rotate(14deg)}}
@keyframes sniffd{0%,60%,100%{transform:none}70%,90%{transform:rotate(-12deg) translateY(2px)}80%{transform:rotate(-8deg) translateY(1px)}}
@keyframes wag{to{transform:rotate(-18deg)}}
@media (prefers-color-scheme:dark){.dog{color:#a39e90}.dog svg{--paper:#1b1b1b}}
@media (prefers-reduced-motion:reduce){.dog{display:none}}
</style>
</head>
<body>
<main class="wrap">
  <div class="code">404</div>
  <div class="note">
    <span class="h">lost sample</span><br>
    <s>check the −80</s><br>
    <s>check the other −80</s><br>
    this page isn't here. it may have been moved, or it never existed.
    <div class="sig">A.</div>
  </div>
  <a class="home" href="/">Back to the homepage</a>
</main>
<div class="dog" aria-hidden="true"><svg viewBox="0 0 70 44" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path class="tl" d="M56 20 C 62 16, 64 10, 62 6"/><path d="M20 22 C 24 16, 50 15, 56 20 C 58 26, 54 30, 50 30 L 26 30 C 21 30, 18 27, 20 22 Z" fill="var(--paper,#fff)"/><path class="lg a" d="M26 30 L25 40"/><path class="lg b" d="M33 30 L34 40"/><path class="lg a" d="M46 30 L45 40"/><path class="lg b" d="M52 29 L53 40"/><g class="hd"><path d="M22 22 C 16 20, 10 24, 6 30 C 4 33, 6 36, 9 35 L 14 33 C 18 31, 21 28, 22 22 Z" fill="var(--paper,#fff)"/><path d="M18 21 C 21 18, 25 20, 24 27" fill="var(--paper,#fff)"/><circle cx="14" cy="27" r="1.2" fill="currentColor" stroke="none"/><circle cx="6.5" cy="33.5" r="1.6" fill="currentColor" stroke="none"/></g></svg></div>
</body>
</html>
